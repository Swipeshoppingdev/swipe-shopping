# App iPhone: costruisce l'app dal codice del sito su un Mac di GitHub.
# - A ogni push su ios/: solo una prova di compilazione (simulatore, senza firma).
# - Avvio a mano ("Run workflow"): build firmata e caricata su TestFlight, se ci sono i segreti
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_KEY (testo del file .p8, ruolo Admin) e APPLE_TEAM_ID.
#   La firma è automatica (certificati gestiti da Apple tramite la chiave API), nessun certificato nel repository.
name: App iPhone

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Firma e carica su TestFlight'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['ios/**', 'capacitor.config.ts', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: Compila per il simulatore (senza firma)
        if: env.SIGNED != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app

      - name: Chiave App Store Connect
        if: env.SIGNED == 'true'
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_KEY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ISSUER KEY_ID KEY TEAM; do
            if [ -z "${!v}" ]; then echo "::error::Manca un segreto (APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_KEY, APPLE_TEAM_ID)"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/keys/AuthKey.p8" || { echo "::error::APPSTORE_KEY non sembra il testo del file .p8 (manca BEGIN PRIVATE KEY)"; exit 1; }
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          echo "TEAM=$TEAM" >> "$GITHUB_ENV"
          echo "AUTH=-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER" >> "$GITHUB_ENV"

      # L'archivio si crea senza firma: la firma automatica qui vorrebbe un profilo "sviluppo", che Apple dà solo
      # con un iPhone registrato. La firma vera (distribuzione App Store) la fa l'esportazione qui sotto.
      - name: Archivio
        if: env.SIGNED == 'true'
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -n 60

      - name: Caricamento su TestFlight
        if: env.SIGNED == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath build/export \
            $AUTH | tail -n 60
          echo "Build ${{ github.run_number }} caricata: compare in App Store Connect > TestFlight dopo qualche minuto di elaborazione." >> "$GITHUB_STEP_SUMMARY"

      - name: Pulizia chiave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
