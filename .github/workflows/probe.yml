# Temporaneo: prova della risposta getVariations (da cancellare dopo l'uso).
name: Prova varianti
on:
  workflow_dispatch:
    inputs:
      asin:
        type: string
        default: B0DP7QPRMS
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-variations.ts
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          PROBE_ASIN: ${{ inputs.asin }}
