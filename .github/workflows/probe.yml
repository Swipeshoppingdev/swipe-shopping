name: Leggi errori (temporanea)
on:
  push:
    branches: [claude/project-thread-t14r8c]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run reports:summary
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
