# Temporaneo: prova della risposta getVariations (da cancellare dopo l'uso).
name: Prova varianti
on:
  workflow_dispatch:
    inputs:
      asin:
        type: string
        default: B0DP7QPRMS
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-amazon.ts
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_SIZES_ONLY: '1'
          AMAZON_MAX_REQUESTS: '40'
          AMAZON_SIZE_REQUESTS: '40'
