name: Invia comunicazioni

# Manda le email scritte dalla pagina Statistiche (#/admin). Controlla la coda ogni 10 minuti.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broadcast
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # src/lib e src/config: isAdminEmail (src/lib/admin.ts) per riconoscere l'admin.
          sparse-checkout: |
            scripts
            src/lib
            src/config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/broadcast.ts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
