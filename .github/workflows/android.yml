# App Android: costruisce l'app dal codice del sito.
# - swipe-shopping.apk: da installare direttamente su un telefono Android per provarla
# - swipe-shopping.aab: il file da caricare su Google Play, solo quando la chiave di firma è nei segreti
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'index.html', 'package.json', 'capacitor.config.ts', '.github/workflows/android.yml', 'android/upload.jks.gpg']

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # Notifiche push: si accendono nell'app quando c'è il file di Firebase.
      - run: npm run build:app
        env:
          VITE_PUSH: ${{ hashFiles('android/app/google-services.json') != '' && '1' || '' }}

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          elif [ -f android/upload.jks.gpg ] && [ -n "$PASSWORD" ]; then
            # Chiave creata da "Crea chiave Google Play": cifrata nel repository, si apre con la password.
            printf '%s' "$PASSWORD" > "$RUNNER_TEMP/pass"
            gpg --batch --quiet --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pass" -d -o "$RUNNER_TEMP/upload.jks" android/upload.jks.gpg
            rm "$RUNNER_TEMP/pass"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Chiave per Google Play non ancora configurata: costruisco solo l'APK di prova."
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../out
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/*.apk ../out/swipe-shopping.apk
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon bundleRelease
            cp app/build/outputs/bundle/release/*.aab ../out/swipe-shopping.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: swipe-shopping-android-${{ github.run_number }}
          path: out/
          retention-days: 14
