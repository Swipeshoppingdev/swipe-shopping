name: Backup database Supabase

# Ogni notte una copia completa del database (dati dell'app e account), cifrata con BACKUP_PASSWORD
# perché il repository è pubblico. Si scarica dalla pagina del giro (Artifacts) e si tiene 3 giorni
# (meno tempo per chi volesse provare a indovinare la password: deve essere lunga e casuale).
# Segreti: SUPABASE_DB_URL (Connect → Session pooler, con la password del database) e BACKUP_PASSWORD.
# Per aprirlo: gpg --decrypt backup.dump.gpg > backup.dump, poi pg_restore.
# Ogni notte arriva anche una mail a Kevin (Resend) con il backup cifrato e una copia cifrata del codice del repository
# (senza catalogo e file generati, che si rifanno da soli): così ne resta una fuori da GitHub per sempre.
on:
  # GitHub ritarda o salta spesso i giri programmati: si prova ogni 3 ore e si fa il backup
  # solo se oggi non ce n'è già uno (vedi "Già fatto oggi?"). A mano parte sempre.
  schedule:
    - cron: '53 */3 * * *'
  # Anche i giri programmati qui li salta: si prova pure dopo ogni aggiornamento del catalogo
  # (che parte in modo affidabile). Sempre con il controllo "Già fatto oggi?".
  workflow_run:
    workflows: ['Aggiorna catalogo Amazon']
    types: [completed]
  workflow_dispatch:
    inputs:
      mail:
        description: Manda la mail anche se oggi non toccherebbe
        type: boolean
        default: false

env:
  # 'weekly' = solo il lunedì, 'daily' = ogni notte, 'off' = mai.
  BACKUP_MAIL: daily
  # L'indirizzo sta nel secret BACKUP_MAIL_TO (il repository è pubblico); senza secret va a info@ (inoltro Cloudflare).
  BACKUP_MAIL_TO: ${{ secrets.BACKUP_MAIL_TO || 'info@swipeshopping.app' }}

permissions:
  contents: read
  actions: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Già fatto oggi?
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          n=0
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/backup.yml/runs?created=>=$day&status=success" -q '.workflow_runs[].id'); do
            n=$(( n + $(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" -q '.total_count') ))
          done
          echo "Backup di oggi già fatti: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.today.outputs.skip != 'true'
        with:
          path: repo
      - name: Controlla i segreti
        id: secrets
        if: steps.today.outputs.skip != 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSWORD" ]; then
            echo "::warning::Backup non attivo: mancano i segreti SUPABASE_DB_URL e/o BACKUP_PASSWORD."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # pg_dump deve essere almeno della versione del server (Supabase usa Postgres 15 o 17).
      - name: Installa pg_dump 17
        if: steps.secrets.outputs.ok == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
      - name: Copia e cifra il database
        if: steps.secrets.outputs.ok == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --file=backup.dump
          size=$(du -h backup.dump | cut -f1)
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output backup.dump.gpg backup.dump 3<<< "$PASSWORD"
          rm backup.dump
          echo "::notice::Backup fatto ($size prima della cifratura)."
      - name: Salva il backup
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup.dump.gpg
          retention-days: 3
      - name: Manda il backup per mail
        if: steps.secrets.outputs.ok == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          FORCE: ${{ inputs.mail }}
        run: |
          set -euo pipefail
          if [ "$FORCE" != "true" ]; then
            [ "$BACKUP_MAIL" = "off" ] && exit 0
            [ "$BACKUP_MAIL" = "weekly" ] && [ "$(date -u +%u)" != "1" ] && exit 0
          fi
          if [ -z "$RESEND_API_KEY" ]; then echo "::warning::Manca RESEND_API_KEY: mail non inviata."; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          # Gmail rifiuta gli zip con dentro file .js, .jar o .bat (il codice ne ha): anche il codice va cifrato,
          # così Gmail non guarda dentro.
          git -C repo archive --format=tar.gz --output="$PWD/code.tar.gz" HEAD -- . ':!public/catalog.json' ':!public/details' \
            ':!android/app/src/main/assets/public' ':!ios/App/App/public' ':!public/play'
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 --output code.tar.gz.gpg code.tar.gz 3<<< "$PASSWORD"
          sha=$(git -C repo rev-parse --short HEAD)
          jq -n --arg to "$BACKUP_MAIL_TO" --arg day "$day" --arg sha "$sha" --rawfile data <(base64 -w0 backup.dump.gpg) --rawfile code <(base64 -w0 code.tar.gz.gpg) '{
            from: "Swipe Shopping <noreply@swipeshopping.app>", to: [$to],
            subject: ("Backup Swipe Shopping " + $day),
            text: ("Backup del " + $day + ".\n\n- Database (dati dell app e account): file .dump.gpg, cifrato con la password BACKUP_PASSWORD.\n- Codice del sito e dell app (versione " + $sha + "): file .tar.gz.gpg, cifrato con la stessa password.\n\nTienili, servono solo in caso di emergenza. Per il ripristino chiedi a Claude nel progetto."),
            attachments: [{ filename: ("swipe-shopping-database-" + $day + ".dump.gpg"), content: $data },
                          { filename: ("swipe-shopping-codice-" + $day + ".tar.gz.gpg"), content: $code }]
          }' > mail.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' --data @mail.json)
          rm mail.json code.tar.gz code.tar.gz.gpg
          if [ "$code" = "200" ]; then echo "::notice::Backup mandato per mail."; else echo "::warning::Mail non inviata ($code): $(head -c 300 resp.txt | sed -E 's/[^ @"]+@[^ @"]+/***/g')"; fi
