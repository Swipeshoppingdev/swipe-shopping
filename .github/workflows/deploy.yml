name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Richiamato da "Aggiorna catalogo Amazon" dopo aver salvato il catalogo nuovo.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:catalog
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Le pagine nuove o cambiate, da segnalare ai motori di ricerca dopo la pubblicazione.
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: dist/indexnow-urls.txt
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # IndexNow: avvisa subito Bing, Yandex, Seznam e Naver delle pagine nuove (Google legge la sitemap).
  # Se non va, la pubblicazione resta valida.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: Segnala le pagine
        run: |
          # Il sito appena pubblicato ci mette un attimo ad arrivare ovunque: prima si aspetta, poi IndexNow controlla la chiave.
          sleep 90
          KEY=e0d33ae511e9ec6bba7fb998c3420519
          split -l 9000 indexnow-urls.txt part-
          for f in part-*; do
            jq -R -s --arg key "$KEY" '{host: "swipeshopping.app", key: $key, keyLocation: ("https://swipeshopping.app/" + $key + ".txt"), urlList: (split("\n") | map(select(length > 0)))}' "$f" > body.json
            curl -sS -o /dev/null -w "IndexNow $f: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json
          done
