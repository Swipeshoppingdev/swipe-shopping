name: Aggiorna catalogo negozi

on:
  # PAUSA (Kevin, 2026-11-09): partenze automatiche spente, si toglie il "#PAUSA " per riattivarle.
  # Una volta al giorno: prezzi e disponibilità di Benetton e Calzedonia, nuovi arrivi.
#PAUSA   schedule:
#PAUSA     - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: Solo prova, senza salvare
        type: boolean
        default: false
      pages:
        description: Pagine Calzedonia da leggere (vuoto = 420)
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

# Stesso gruppo della sincronizzazione Amazon: mai due aggiornamenti del catalogo insieme.
concurrency:
  group: sync-amazon
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # L'ultimo main, non il commit che ha avviato il giro: un aggiornamento in coda parte dal catalogo
      # salvato da quello prima (altrimenti il push finisce in conflitto).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Leggi i prodotti dei negozi
        run: npm run sync:stores -- ${{ inputs.dry && '--dry' || '' }}
        env:
          CALZEDONIA_MAX_PAGES: ${{ inputs.pages || '420' }}
          STORES_DEBUG: ${{ inputs.dry && '1' || '' }}
      - run: npm run check:catalog
      - name: Salva il catalogo aggiornato
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json public/details
          git diff --cached --quiet && exit 0
          git commit -m "Catalogo aggiornato dai negozi"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
  deploy:
    needs: sync
    if: ${{ !inputs.dry }}
    uses: ./.github/workflows/deploy.yml
