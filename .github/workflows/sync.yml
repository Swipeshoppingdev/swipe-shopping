name: Aggiorna catalogo Amazon

on:
  # Due aggiornamenti al giorno (prezzi sempre con meno di 24 ore, come richiede Amazon).
  # GitHub a volte ritarda o salta le partenze programmate: si prova ogni 2 ore e il giro parte
  # solo se l'ultimo catalogo ha più di 10 ore (vedi il job "check"). A mano parte sempre.
  schedule:
    - cron: '17 */2 * * *'
  # GitHub salta molte partenze programmate (il 13/10 nessuna tra le 03:25 e le 16:40): si controlla anche
  # a ogni modifica del sito. Il controllo è veloce e il giro parte solo se serve.
  push:
    branches: [main]
    paths-ignore: ['public/catalog.json', 'public/details/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-amazon
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - id: age
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Conta solo l'ultimo aggiornamento da Amazon (non le pulizie a mano o i negozi, che non rinnovano i prezzi).
          last=$(gh api "repos/${{ github.repository }}/commits?path=public/catalog.json&per_page=50" \
            -q '[.[] | select(.commit.message | startswith("Catalogo aggiornato da Amazon"))][0].commit.committer.date')
          if [ -z "$last" ] || [ "$last" = "null" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 3600 ))
          echo "Ultimo aggiornamento da Amazon: $last ($age ore fa)"
          if [ "$age" -ge 10 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
  sync:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 4200 richieste a una al secondo: circa 80 minuti, più pulizia e pubblicazione.
    timeout-minutes: 120
    steps:
      # L'ultimo main, non il commit che ha avviato il giro: un aggiornamento in coda parte dal catalogo
      # salvato da quello prima (altrimenti il push finisce in conflitto).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scarica foto, prezzi e nuovi prodotti da Amazon
        run: npm run sync:amazon
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
      - name: Pulizia del catalogo (foto rotte e doppioni)
        run: node scripts/clean-catalog.ts
        continue-on-error: true
      - run: npm run check:catalog
      - name: Salva il catalogo aggiornato
        run: |
          git config user.name "catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json public/details
          git diff --cached --quiet && exit 0
          git commit -m "Catalogo aggiornato da Amazon"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - name: Avvisa chi ha un preferito in offerta (notifica sul telefono o email)
        run: npm run alerts:price
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Avvisa chi segue una marca delle novità (solo notifiche)
        run: node scripts/brand-alerts.ts
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Riepilogo segnalazioni dei prodotti
        run: npm run reports:summary
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml
