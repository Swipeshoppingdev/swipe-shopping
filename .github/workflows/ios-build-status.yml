# Aspetta che App Store Connect finisca di elaborare una build iPhone (si avvia a mano).
name: Stato build iPhone

on:
  workflow_dispatch:
    inputs:
      build:
        description: Numero della build
        required: true

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stato
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_KEY }}
          BUILD: ${{ inputs.build }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          APPSTORE_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" node scripts/appstore.ts build-status "$BUILD"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
