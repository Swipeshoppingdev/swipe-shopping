    <!-- Le foto dei prodotti arrivano da Amazon: collegamento aperto subito, la prima carta compare prima -->
    <link rel="preconnect" href="https://m.media-amazon.com" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Tema scelto (o quello del telefono) applicato prima del disegno, senza lampi bianchi.
      try {
        var t = JSON.parse(localStorage.getItem('swipeshop:v1:theme') || 'null')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name=theme-color]').content = '#0e0e10'
        }
        // Sezioni oltre la moda: tenere allineato con SECTIONS in src/config/categories.ts.
        var m = (/[?&]sezione=(\w+)/.exec(location.search) || [])[1] || JSON.parse(localStorage.getItem('swipeshop:v1:mode') || 'null')
        if (['tech', 'gadget', 'snack', 'beauty', 'casa', 'animali'].indexOf(m) >= 0) document.documentElement.classList.add(m)
        // All'apertura (senza una pagina precisa) si torna dove si era: le sezioni ricordano già la loro, Outfit va riaperto qui.
        var sp = JSON.parse(localStorage.getItem('swipeshop:v1:inOutfit') || 'false') ? 'outfit' : JSON.parse(localStorage.getItem('swipeshop:v1:inGifts') || 'false') ? 'regali' : null
        if (sp && !/[?&]sezione=/.test(location.search) && /^(#\/?(scopri)?)?$/.test(location.hash)) history.replaceState(null, '', '#/' + sp)
        // Outfit e Regali restano attivi anche su Amici, Profilo… (vedi src/lib/outfitMode.ts)
        var hm = /^#\/(outfit|regali)/.exec(location.hash)
        if (hm) sp = hm[1]
        else if (/^(#\/?)?(scopri|preferiti|filtri|insieme|outfit|regali)?([/?].*)?$/.test(location.hash)) sp = null
        if (sp) document.documentElement.classList.add(sp)
        // Halloween: dal 20 al 31 ottobre l'area Regali è arancione (vedi giftSeason in src/pages/GiftsPage.tsx).
        var now = new Date()
        if (sp === 'regali' && now.getMonth() === 9 && now.getDate() >= 20) document.documentElement.classList.add('halloween')
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>html.dark #root{background:#0e0e10;color:#9d9da4}html.dark #root h1{color:#f4f4f6!important}</style>
    <script>
      // Il catalogo della sezione aperta inizia a scaricarsi subito, in parallelo al codice dell'app.
      // Nell'app (Capacitor) il catalogo arriva dal sito online, non da qui.
      if (!window.Capacitor) {
        var c = document.documentElement.classList
        var sec = ['tech', 'gadget', 'snack', 'beauty', 'casa', 'animali'].filter(function (x) { return c.contains(x) })[0] || 'moda'
        // Prima l'anteprima (piccola: le prime carte), poi il catalogo completo.
        ;['-anteprima.json', '.json'].forEach(function (end) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'fetch'
          l.crossOrigin = 'anonymous'
          l.href = './catalog-' + sec + end
          document.head.appendChild(l)
        })
      }
    </script>
