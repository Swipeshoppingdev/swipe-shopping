<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Tema scelto (o quello del telefono) applicato prima del disegno, senza lampi bianchi.
      try {
        var t = JSON.parse(localStorage.getItem('swipeshop:v1:theme') || 'null')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name=theme-color]').content = '#0e0e10'
        }
        // Sezioni oltre la moda: tenere allineato con SECTIONS in src/config/categories.ts.
        var m = (/[?&]sezione=(\w+)/.exec(location.search) || [])[1] || JSON.parse(localStorage.getItem('swipeshop:v1:mode') || 'null')
        if (['tech', 'gadget', 'snack', 'beauty', 'casa', 'animali'].indexOf(m) >= 0) document.documentElement.classList.add(m)
        if (/^#\/outfit/.test(location.hash)) document.documentElement.classList.add('outfit')
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Il catalogo della sezione aperta inizia a scaricarsi subito, in parallelo al codice dell'app.
      // Nell'app (Capacitor) il catalogo arriva dal sito online, non da qui.
      if (!window.Capacitor) {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'fetch'
        l.crossOrigin = 'anonymous'
        var c = document.documentElement.classList
        l.href = './catalog-' + (['tech', 'gadget', 'snack', 'beauty', 'casa', 'animali'].filter(function (x) { return c.contains(x) })[0] || 'moda') + '.json'
        document.head.appendChild(l)
      }
    </script>
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Swipe Shop" />
    <meta name="description" content="Scorri, salva e acquista la moda dei migliori marchi, un prodotto alla volta." />
    <title>Swipe Shopping</title>
    <link rel="canonical" href="https://swipeshopping.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swipe Shopping" />
    <meta property="og:title" content="Swipe Shopping" />
    <meta property="og:description" content="Scorri, salva e acquista la moda dei migliori marchi, un prodotto alla volta." />
    <meta property="og:url" content="https://swipeshopping.app/" />
    <meta property="og:image" content="https://swipeshopping.app/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
